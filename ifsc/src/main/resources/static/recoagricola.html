<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recomendações de Manejo - Brainstorm Agrícola</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="recoagricola.css"> </head>
<body class="bg-manejo">

    <header class="main-header">
        <div class="container header-content">
            <div class="logo-wrapper">
                <img src="image_565ac6.png" alt="Brainstorm Agrícola" class="header-logo-img">
            </div>
            <div class="user-profile">
                <i class="fa-solid fa-circle-user"></i>
            </div>
        </div>
    </header>

    <main class="container page-content">
        <div class="header-internal">
            <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i></a>
            <h2>Recomendações de manejo agrícola</h2>
        </div>

        <section class="manejo-form">
            <label>Nome da cultura</label>
            <div class="culture-selection">
                <div class="culture-item active">
                    <div class="culture-icon"><i class="fa-solid fa-seedling"></i></div>
                    <span>Soja</span>
                </div>
                <div class="culture-item">
                    <div class="culture-icon"><i class="fa-solid fa-wheat-awn"></i></div>
                    <span>Milho</span>
                </div>
            </div>

            <div class="input-group">
                <label>Estágio da Lavora</label>
                <input type="text" placeholder="ex: Germinação, Crescimento, Colheita">
            </div>

            <div class="input-group">
                <label>Recomendações</label>
                <input type="text" placeholder="ex: 'Regar 2x ao dia', 'Aplicar fertilizante'">
            </div>

            <div class="input-group">
                <label>Data da última atualização</label>
                <input type="text" placeholder="ex: 'Atualizado em 24/10/2025'">
            </div>
        </section>
    </main>

</body>
</html>
