<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calendário e Clima - Brainstorm Agrícola</title>


<!-- Ícones -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<!-- CSS -->
<link rel="stylesheet" href="css/clima.css">


    <script src="js/auth.js"></script>
</head>


<body>


<div class="pagina">


    <div class="card-calendario-clima">


        <div class="opcoes">


            <div class="opcao" onclick="selecionar('calendario', this)">


                <h3>Calendário</h3>


                <div class="icone">

                    <i class="fa-solid fa-calendar-days"></i>

                </div>


            </div>



            <div class="opcao" onclick="selecionar('clima', this)">


                <h3>Clima</h3>


                <div class="icone">

                    <i class="fa-solid fa-cloud-sun-rain"></i>

                </div>


            </div>


        </div>



        <button onclick="acessar()">

            Acessar

        </button>



    </div>



</div>



<script src="js/climaecalendario.js"></script>


</body>

</html>
